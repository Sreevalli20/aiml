services:
  - type: web
    name: xyz-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head || true && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xyz-ai-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-haiku-20240307
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app,http://localhost:3000,http://localhost:5173
      - key: APP_NAME
        value: XYZ AI School Assistant
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: false
      - key: FORCE_REDEPLOY
        value: "2026-08-18-23-30"

databases:
  - name: xyz-ai-postgres
    databaseName: xyz_ai
    user: xyz_ai_user
    plan: free
